name: ci

on:
  push:
  pull_request:

jobs:
  generated-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build pinned and patched rozectl
        run: bash scripts/build-patched-rozectl.sh "$RUNNER_TEMP/roze-patched"
      - name: Regenerate API, model, and OpenAPI
        env:
          ROZECTL_BIN: ${{ runner.temp }}/roze-patched/target/debug/rozectl
        run: bash scripts/regenerate.sh
      - name: Reject generated drift
        run: git diff --exit-code

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  production-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify generated production gates
        working-directory: services/roze-ent-api
        run: bash ops/production-verify.sh
      - name: Upload production verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roze-ent-production-verify
          retention-days: 30
          if-no-files-found: error
          path: services/roze-ent-api/ops/production-verify-report.json

  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/postgres-smoke.sh

  mysql-migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/mysql-migration-smoke.sh
