services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roze_ent
      POSTGRES_USER: roze
      POSTGRES_PASSWORD: roze
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roze -d roze_ent"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - roze-ent-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  roze-ent-postgres:

