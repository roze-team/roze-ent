[package]
name = "roze-ent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Roze model schema parsing, normalization, inspection, and deterministic code generation"
repository = "https://github.com/roze-team/roze-ent"

[dependencies]
anyhow = "1"
futures-util = "0.3"
mongodb = "3.7.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "mysql"] }
toml_edit = "0.25.12"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
