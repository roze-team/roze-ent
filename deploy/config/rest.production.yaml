name: roze-ent
profile: production

logging:
  enabled: true
  level: info
  format: json
  stdout: true
  ansi: false
  target: true

rest:
  addr: 0.0.0.0:3000
  register: false
  connect_info: true
  middlewares:
    recover: true
    trace: true
    stat: true
    prometheus: true
    cors: false
    timeout: true
    max_conns: 1000
    shedding:
      concurrency: 500
      window_ms: 1000
      min_samples: 100
      max_avg_latency_ms: 500
      max_failure_ratio_per_mille: 100
      cool_down_ms: 5000
    request_body_limit_bytes: 1048576
    auth_public_routes:
      - /api/v1/healthz
      - /api/v1/readyz
      - /api/v1/startupz
      - /api/v1/metrics
    trust_forwarded_identity_headers: false
    trusted_proxy_cidrs: []

database:
  mode: direct
  url: env://ROZE_ENT_DATABASE_URL
  max_connections: 50
  min_connections: 5
  connect_timeout_secs: 10
  idle_timeout_secs: 300
  sqlx_logging: false

cache:
  url: env://ROZE_ENT_REDIS_URL
  namespace: roze-ent:production
  default_ttl_secs: 300

auth:
  jwt_keys:
    - id: production-v1
      secret: env://ROZE_ENT_JWT_SECRET
  jwt_active_key_id: production-v1
  jwt_issuer: roze-ent
  jwt_audience: roze-services
  jwt_expiration_secs: 900
  jwt_clock_skew_secs: 30
  revoked_token_ids: []

governance:
  timeout_ms: 5000
  rate_limiter:
    store: redis
    redis_url: env://ROZE_ENT_REDIS_URL
    key_prefix: roze:rate-limit:v1
    namespace: roze-ent:production
    timeout_ms: 100
    unavailable_policy: fail-closed
  rate_limit:
    burst: 100
    tokens_per_refill: 10
    refill_ms: 100
    key:
      dimensions: [route, client_ip]
      missing: reject
  breaker:
    failure_threshold: 5
    reset_timeout_ms: 30000
  shedding:
    concurrency: 500
    window_ms: 1000
    min_samples: 100
    max_avg_latency_ms: 500
    max_failure_ratio_per_mille: 100
    cool_down_ms: 5000
  fallback:
    enabled: false
    status: 503
    body:
      code: 503
      message: degraded
    headers:
      x-roze-fallback: governance
  routes: {}
