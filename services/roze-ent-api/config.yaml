name: roze-ent
profile: development # development, test, production
logging:
  enabled: true
  level: info
  format: text # use json for container deployments
  stdout: true
  ansi: true # disable for non-interactive runtimes
  target: true
rest:
  addr: 127.0.0.1:3000
  register: false
  # Inject ConnectInfo<SocketAddr>; required for trusted proxy client IP policy.
  connect_info: true
  middlewares:
    recover: true
    trace: true
    stat: true
    prometheus: true
    cors: true
    # cors_config:
    #   allow_origins: ["*"]
    #   allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
    #   allow_headers: ["authorization", "content-type", "x-request-id", "x-trace-id"]
    #   expose_headers: ["x-request-id", "x-trace-id"]
    #   allow_credentials: false
    #   max_age_seconds: 3600
    timeout: true
    # max_conns: 1000
    # shedding:
    #   concurrency: 1000
    #   window_ms: 1000
    #   min_samples: 100
    #   max_avg_latency_ms: 500
    #   max_failure_ratio_per_mille: 500
    #   cool_down_ms: 1000
    # gunzip: true
    # request_body_limit_bytes: 2097152
    # Routes may be written as "/path", "GET /path", or "/prefix/*".
    auth_public_routes: ["/api/v1/healthz", "/api/v1/metrics", "/api/v1/readyz", "/api/v1/startupz"]
    # Enable only when direct client access is blocked by a trusted proxy.
    trust_forwarded_identity_headers: false
    # Forwarding headers are ignored unless the TCP peer matches one of these CIDRs.
    trusted_proxy_cidrs: []
registry:
  kind: memory
  endpoints: []
  # prefix: /roze/services
  # ttl_seconds: 10
  # renew_interval_secs: 3
  # user: roze
  # pass: env://ROZE_REGISTRY_PASSWORD
  # ca_cert_file: certs/etcd-ca.pem
  # cert_file: certs/etcd-client.pem
  # cert_key_file: certs/etcd-client.key
  # insecure_skip_verify: false
governance:
  timeout_ms: 5000
  rate_limiter:
    store: auto # explicit redis_url, then cache.url, otherwise development memory
    # redis_url: env://REDIS_URL # overrides cache.url
    key_prefix: roze:rate-limit:v1
    # namespace defaults to the service profile; override for shared Redis deployments
    timeout_ms: 100
    unavailable_policy: fail-closed # fail-open or fail-closed
  rate_limit:
    burst: 100
    refill_ms: 10
    key:
      dimensions: [route]
      # dimensions may include route, client_ip, subject, tenant
      # headers: [x-api-key]
      missing: reject
  breaker:
    failure_threshold: 5
    reset_timeout_ms: 30000
  shedding:
    concurrency: 1000
    window_ms: 1000
    min_samples: 100
    max_avg_latency_ms: 500
    max_failure_ratio_per_mille: 500
    cool_down_ms: 1000
  fallback:
    enabled: false
    status: 503
    body:
      code: 503
      message: degraded
    headers:
      x-roze-fallback: governance
  routes:
    create_user:
      timeout_ms: 5000
      retry:
        max_attempts: 1
        backoff_ms: 50
        max_backoff_ms: 500
        budget_percent: 10
      rate_limit:
        burst: 100
        refill_ms: 10
      breaker:
        failure_threshold: 5
        reset_timeout_ms: 30000
      shedding:
        concurrency: 100
        window_ms: 1000
        min_samples: 100
        max_avg_latency_ms: 500
        max_failure_ratio_per_mille: 500
        cool_down_ms: 1000
      fallback:
        enabled: false
        status: 503
        body:
          code: 503
          message: degraded
        headers:
          x-roze-fallback: route
    get_user:
      timeout_ms: 5000
      retry:
        max_attempts: 2
        backoff_ms: 50
        max_backoff_ms: 500
        budget_percent: 10
      rate_limit:
        burst: 100
        refill_ms: 10
      breaker:
        failure_threshold: 5
        reset_timeout_ms: 30000
      shedding:
        concurrency: 100
        window_ms: 1000
        min_samples: 100
        max_avg_latency_ms: 500
        max_failure_ratio_per_mille: 500
        cool_down_ms: 1000
      fallback:
        enabled: false
        status: 503
        body:
          code: 503
          message: degraded
        headers:
          x-roze-fallback: route
    list_users:
      timeout_ms: 5000
      retry:
        max_attempts: 2
        backoff_ms: 50
        max_backoff_ms: 500
        budget_percent: 10
      rate_limit:
