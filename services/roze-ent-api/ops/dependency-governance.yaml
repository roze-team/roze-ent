# Generated by rozectl. Required for every downstream before broad production rollout.
service: roze-ent
boundary: rest
endpoint_count: 16
mode: dependency_governance_readiness
inventory:
  required: true
  if_no_downstream:
    evidence: no_runtime_dependency_clients_or_external_calls
  downstream_fields:
    - name
    - type
    - owner
    - endpoint_or_discovery_key
    - timeout_budget
    - retry_policy
    - breaker_policy
    - fallback_policy
    - data_classification
principles:
  deadline_propagation_required: true
  no_unbounded_retry: true
  no_downstream_without_owner: true
  no_dependency_without_metrics: true
  fallback_or_explicit_fail_closed_required: true
  plaintext_downgrade_forbidden: true
transport_security:
  required_for_network_downstreams: true
  trust:
    public_roots_allowed: true
    private_ca_files_supported: true
    hostname_or_server_name_validation_required: true
    certificate_validation_bypass_forbidden: true
  mutual_tls:
    required_for_internal_sensitive_or_privileged_dependencies: true
    client_certificate_and_private_key_must_be_paired: true
    private_key_must_come_from_secret_store_or_mounted_secret: true
    generated_config_must_not_contain_private_key_material: true
  lifecycle:
    parse_and_validate_before_runtime_snapshot_swap: true
    invalid_tls_update_keeps_last_valid_snapshot: true
    inflight_calls_keep_their_original_snapshot: true
    certificate_rotation_without_process_restart_required: true
  websocket_and_streaming:
    wss_uses_same_strict_tls_profile: true
    handshake_deadline_uses_remaining_request_budget: true
    plaintext_fallback_forbidden: true
  evidence:
    - private_ca_handshake
    - client_certificate_authentication
    - server_name_mismatch_rejection
    - expired_or_untrusted_certificate_rejection
    - certificate_rotation_snapshot_test
    - invalid_tls_reload_retains_last_valid_runtime
discovery:
  required_for_dynamic_downstreams: true
  checks:
    - registry_add_remove_event_observed
    - stale_endpoint_evicted
    - readiness_or_health_used_for_endpoint_selection
    - config_center_or_registry_failure_has_cached_behavior
  evidence:
    - registry_event_log
    - endpoint_set_before_after
    - stale_endpoint_request_sample
load_balancing:
  required: true
  policy: round_robin_weighted_or_platform_policy
  checks:
    - traffic_distribution_is_visible
    - unhealthy_endpoint_gets_less_or_no_traffic
    - outlier_endpoint_is_detected
    - per_endpoint_latency_is_visible
  metrics:
    - roze_dependency_requests_total
    - roze_dependency_latency_seconds
    - roze_dependency_endpoint_health
    - roze_dependency_outlier_total
timeouts_and_cancellation:
  probe: representative_http_handler_calls_declared_downstream_or_declares_none
  required:
    - client_timeout_less_than_request_deadline
    - deadline_propagates_to_logic_and_dependency
    - cancellation_stops_inflight_dependency_call
    - timeout_error_maps_to_typed_error
  evidence:
    - timeout_trace
    - cancellation_trace
    - typed_error_sample
resilience:
  retry_budget:
    required: true
    checks:
      - max_attempts_defined
      - backoff_with_jitter_defined
      - retry_only_idempotent_or_explicitly_allowed_operations
      - retry_budget_metric_exported
  circuit_breaker:
    required: true
    checks:
      - open_half_open_closed_transitions_observed
      - breaker_state_metric_exported
      - breaker_open_does_not_amplify_dependency_pressure
  bulkhead:
    required: true
    checks:
      - max_inflight_per_dependency_defined
      - saturation_does_not_block_unrelated_dependencies
      - queue_or_semaphore_wait_is_bounded
  fallback:
    required: explicit_policy
    allowed_modes:
      - cached_response
      - degraded_response
      - fail_closed
      - alternate_dependency
tests:
  - test: downstream_inventory
    pass:
      - every_dependency_has_owner
      - every_dependency_has_timeout_retry_breaker_policy
      - every_dependency_has_metrics_and_trace_labels
    evidence:
      - dependency_inventory_table

  - test: endpoint_change
    pass:
      - new_endpoint_receives_traffic
      - removed_endpoint_stops_receiving_traffic
      - stale_endpoint_error_does_not_cause_slo_fast_burn
    evidence:
      - registry_event_log
      - load_balancing_distribution_sample

  - test: slow_downstream
    pass:
      - timeout_fires_within_budget
      - breaker_or_shedding_protects_service
      - accepted_requests_keep_latency_budget
    evidence:
      - p99_latency_before_during_after
      - breaker_transition_metric
      - resource_trend

  - test: failing_downstream
    pass:
      - breaker_opens
      - retry_budget_caps_attempts
      - fallback_or_fail_closed_behavior_matches_policy
      - recovery_closes_breaker_after_dependency_recovers
    evidence:
      - breaker_timeline
      - retry_budget_metric
      - fallback_result

  - test: dependency_saturation
    pass:
      - bulkhead_limits_inflight_calls
      - unrelated_dependencies_remain_healthy
      - service_remains_ready_or_drains_intentionally
    evidence:
      - inflight_metric_sample
      - unrelated_dependency_latency_sample
      - readiness_timeline

  - test: transport_security
    pass:
      - every_network_dependency_declares_plaintext_or_tls_policy
      - sensitive_or_privileged_internal_dependency_uses_mutual_tls
      - server_identity_is_cryptographically_validated
      - invalid_certificate_or_key_fails_before_runtime_swap
      - invalid_reload_keeps_last_valid_runtime
      - certificate_rotation_does_not_interrupt_inflight_calls
      - wss_or_streaming_transport_never_downgrades_to_plaintext
    evidence:
      - tls_dependency_inventory
      - private_ca_mutual_tls_handshake_result
      - server_name_and_untrusted_ca_negative_tests
      - certificate_rotation_test_result
      - invalid_reload_snapshot_test_result
promotion_required:
  downstream_inventory_passed: true
  endpoint_change_test_passed: true
  slow_downstream_test_passed: true
  failing_downstream_test_passed: true
  dependency_saturation_test_passed: true
  transport_security_test_passed: true
  fallback_policy_reviewed: true
  owner_signoff: required
blocking_findings:
  - dependency_without_owner
  - dependency_without_timeout
  - dependency_without_retry_budget
  - dependency_without_circuit_breaker
  - dependency_without_metrics_or_traces
  - unbounded_connection_pool
  - network_dependency_without_transport_security_policy
  - private_key_material_in_generated_config
  - tls_server_identity_validation_disabled
  - sensitive_internal_dependency_without_mutual_tls
  - certificate_rotation_requires_unbounded_downtime
  - invalid_tls_reload_replaces_last_valid_runtime
  - wss_or_streaming_transport_allows_plaintext_downgrade
  - fallback_claim_without_test_evidence
