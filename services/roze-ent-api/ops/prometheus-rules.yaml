# Generated by rozectl. Review metric names against your Prometheus registry before enabling.
groups:
  - name: roze-ent-rest-production
    rules:
      - alert: RozeGeneratedServiceDown
        expr: up{service="roze-ent"} == 0
        for: 2m
        labels:
          severity: critical
          service: roze-ent
          boundary: rest
        annotations:
          summary: "roze-ent is down"
          description: "No scrape target is up for generated service roze-ent."

      - alert: RozeGeneratedServiceHighErrorRate
        expr: |
          sum(rate(roze_http_requests_total{service="roze-ent",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(roze_http_requests_total{service="roze-ent"}[5m])), 1)
          > 0.01
        for: 10m
        labels:
          severity: warning
          service: roze-ent
          boundary: rest
        annotations:
          summary: "roze-ent error rate is above 1%"
          description: "Generated service error budget is burning; inspect traces, logs, and failure timeline."

      - alert: RozeGeneratedServiceHighP99Latency
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(roze_http_request_duration_seconds_bucket{service="roze-ent"}[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: roze-ent
          boundary: rest
        annotations:
          summary: "roze-ent p99 latency is above 1s"
          description: "Check timeout, load shedding, downstream latency, and retry budget evidence."

      - alert: RozeGeneratedServiceRateLimitRejecting
        expr: sum(rate(roze_resilience_decisions_total{service="roze-ent",boundary="rest",kind="rate_limit",decision="rejected"}[5m])) > 0
        for: 5m
        labels:
          severity: info
          service: roze-ent
          boundary: rest
        annotations:
          summary: "roze-ent is rejecting requests by rate limit"
          description: "Verify client behavior, configured limits, and allowed/rejected counter evidence."

      - alert: RozeGeneratedServiceCircuitBreakerOpen
        expr: sum(rate(roze_resilience_decisions_total{service="roze-ent",boundary="rest",kind="breaker",decision="open"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
          service: roze-ent
          boundary: rest
        annotations:
          summary: "roze-ent circuit breaker is open"
          description: "Inspect downstream health, breaker transition metrics, and recovery objective."

      - alert: RozeGeneratedServiceLoadShedding
        expr: sum(rate(roze_resilience_decisions_total{service="roze-ent",boundary="rest",kind="load_shedding",decision="shed"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
          service: roze-ent
          boundary: rest
        annotations:
          summary: "roze-ent is shedding load"
          description: "Compare resource trends, p99 latency, and configured shedding thresholds."

      - alert: RozeGeneratedServiceRestarting
        expr: increase(process_start_time_seconds{service="roze-ent"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
          service: roze-ent
          boundary: rest
        annotations:
          summary: "roze-ent restarted"
          description: "Record restart count and attach logs to the production evidence report."
