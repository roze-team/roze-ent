# Generated by rozectl. Required for runtime governance before production promotion.
service: roze-ent
boundary: rest
endpoint_count: 8
mode: runtime_hardening
entry_probe: representative_http_request_with_server_timeout_and_client_cancel
policy:
  timeout:
    required: true
    source: generated_config_and_platform_defaults
    enforce_at:
      - transport_entry
      - logic_boundary
      - downstream_dependency
    evidence:
      - timeout_metric
      - deadline_trace
      - cancellation_log
  rate_limit:
    required: true
    source: generated_config_or_gateway_policy
    modes:
      - per_service
      - per_operation_when_needed
      - tenant_or_principal_when_low_cardinality
    evidence:
      - allowed_rejected_metric_sample
      - limit_config_snapshot
  circuit_breaker:
    required: true
    source: dependency_governance_and_runtime_policy
    states:
      - closed
      - open
      - half_open
    half_open_policy:
      probe_concurrency: 1
      concurrent_probe_requests: rejected
      successful_probe: close
      failed_probe: reopen
      cancelled_probe: reopen_without_incrementing_failure_count
    invariants:
      - stale_closed_request_completion_cannot_close_newer_open_state
      - only_the_active_probe_can_transition_half_open_state
    evidence:
      - breaker_transition_metric
      - dependency_failure_trace
      - single_half_open_probe_test
      - cancelled_probe_recovery_test
  load_shedding:
    required: true
    source: generated_config_or_platform_policy
    signals:
      - concurrency
      - queue_depth
      - latency_budget
      - cpu_or_memory_pressure
    statistics:
      rolling_buckets: 50
      hot_path_memory: bounded_independent_of_request_rate
      hard_concurrency_rejection_starts_cool_down: false
    completion_paths:
      - success
      - failure
      - cancellation_or_guard_drop
    invariants:
      - accepted_operation_releases_inflight_exactly_once
      - cancellation_does_not_open_circuit_breaker
      - statistics_memory_is_bounded_independent_of_rps
    evidence:
      - shedding_decision_metric
      - protected_latency_sample
      - cancellation_release_test
      - bounded_rolling_window_test
  retry_budget:
    required: true
    max_attempts: service_owner_defined
    backoff_algorithm: exponential_full_jitter
    backoff_cap: max_backoff_ms
    deadline_aware: true
    cancellation_checked_before_retry: true
    attempt_metric_counts_actual_retry_calls_only: true
    amplification_cap: required
    evidence:
      - retry_attempt_metric
      - jitter_bounds_test
      - deadline_exhaustion_test
      - cancellation_before_retry_test
      - amplification_review
  deadline_propagation:
    required: true
    propagate_to:
      - auth
      - validation
      - logic
      - database
      - cache
      - rpc_or_http_downstream
      - mq_or_outbox_when_used
    evidence:
      - deadline_trace_sample
      - cancelled_work_does_not_continue
  graceful_shutdown:
    required: true
    phases:
      - mark_not_ready
      - stop_accepting_new_work
      - drain_in_flight_until_deadline
      - cancel_remaining_work
      - flush_metrics_logs_traces
    evidence:
      - shutdown_timeline
      - readyz_or_readiness_transition
      - no_lost_in_flight_work_without_explicit_cancellation
  resource_guards:
    required: true
    guards:
      - bounded_request_body_or_message_size
      - bounded_concurrency
      - bounded_connection_or_stream_lifetime
      - bounded_queue_depth
      - memory_and_cpu_alerts
    evidence:
      - resource_trend_sample
      - guard_rejection_sample
metrics:
  request_metric: roze_http_requests_total
  latency_metric: roze_http_request_duration_seconds_bucket
  resilience_metric: roze_resilience_decisions_total
  resilience_labels:
    - service
    - boundary
    - kind
    - decision
  resilience_query_schema_matches_runtime: true
  resource_metrics:
    - process_cpu_seconds_total
    - process_resident_memory_bytes
    - tokio_tasks_or_runtime_diagnostics_when_available
tests:
  - test: timeout_and_deadline
    probe: representative_http_request_with_server_timeout_and_client_cancel
    pass:
      - request_or_call_times_out_with_typed_error
      - downstream_work_receives_deadline
      - cancellation_is_observed_before_business_side_effect
    evidence:
      - metrics_query: sum(rate(roze_resilience_decisions_total{service="roze-ent",boundary="rest",kind=~"timeout|deadline"}[5m]))
      - trace_query: deadline_propagates_to_logic_and_dependency
      - log_query: timeout_or_cancellation_log_with_trace_id

  - test: rate_limit_and_backpressure
    pass:
      - excess_work_rejected_or_queued_with_bound
      - accepted_work_stays_inside_latency_budget
      - retry_after_or_typed_limit_error_defined
    evidence:
      - metrics_query: sum(rate(roze_resilience_decisions_total{service="roze-ent",boundary="rest",kind="rate_limit"}[5m])) by (decision)
      - load_profile
      - rejection_sample

  - test: breaker_and_retry_budget
    pass:
      - dependency_5xx_opens_breaker
      - half_open_probe_is_bounded
      - retries_do_not_exceed_budget
      - fallback_or_degraded_response_is_documented
    evidence:
      - metrics_query: sum(rate(roze_resilience_decisions_total{service="roze-ent",boundary="rest",kind=~"breaker|retry"}[5m])) by (decision)
      - breaker_transition_timeline
      - retry_amplification_report

  - test: load_shedding_and_resource_guards
    pass:
      - shedding_starts_before_resource_exhaustion
      - memory_and_cpu_trend_remain_bounded
      - queue_or_concurrency_limit_is_visible
    evidence:
      - metrics_query: sum(rate(roze_resilience_decisions_total{service="roze-ent",boundary="rest",kind="load_shedding"}[5m])) by (decision)
      - resource_trend_report
      - protected_latency_report

  - test: shutdown_and_drain
    pass:
      - readiness_turns_false_before_stop
      - in_flight_work_drains_or_is_cancelled_by_deadline
      - final_metrics_logs_and_traces_are_flushed
    evidence:
      - shutdown_timeline
      - readiness_probe_output
      - lifecycle_summary
promotion_required:
  timeout_deadline_test_passed: true
  rate_limit_backpressure_test_passed: true
  breaker_retry_budget_test_passed: true
  load_shedding_resource_guard_test_passed: true
  shutdown_drain_test_passed: true
  resource_alerts_attached: true
  owner_signoff: required
blocking_findings:
  - missing_timeout_or_deadline_policy
  - unbounded_retry_amplification
  - breaker_without_state_transition_evidence
  - load_shedding_without_resource_trend
  - graceful_shutdown_without_readiness_drain_timeline
  - unbounded_queue_body_message_or_concurrency
