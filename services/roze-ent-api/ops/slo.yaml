# Generated by rozectl. Tune targets with the service owner before launch.
service: roze-ent
boundary: rest
window: 30d
objectives:
  availability:
    target: 99.9
    unit: percent
    sli: up{service="roze-ent"} == 1
    evidence: uptime_ratio_and_restart_count
  success_rate:
    target: 99.0
    unit: percent
    sli: 1 - (5xx_requests / total_requests)
    prometheus: sum(rate(roze_http_requests_total{service="roze-ent",status=~"5.."}[5m])) / clamp_min(sum(rate(roze_http_requests_total{service="roze-ent"}[5m])), 1)
    evidence: error_rate_and_error_budget_burn
  latency_p99:
    target: 1
    unit: second
    sli: p99_request_latency
    prometheus: histogram_quantile(0.99, sum(rate(roze_http_request_duration_seconds_bucket{service="roze-ent"}[5m])) by (le))
    evidence: p99_latency_trend_and_timeout_budget
  resilience_rejection_rate:
    target: 0.5
    unit: percent
    sli: rate_limit_breaker_and_shedding_rejections
    prometheus: sum(rate(roze_resilience_decisions_total{service="roze-ent",boundary="rest",decision=~"rejected|open|shed"}[5m])) / clamp_min(sum(rate(roze_http_requests_total{service="roze-ent"}[5m])), 1)
    evidence: governance_rejection_rate_and_recovery_window
burn_rate_alerts:
  fast:
    window: 5m
    threshold: 14.4
  slow:
    window: 1h
    threshold: 6
promotion_required:
  generated_services_report: true
  lifecycle_report: true
  alert_rules_attached: true
  dashboard_attached: true
  rollback_notes: true
